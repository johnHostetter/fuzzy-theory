[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "fuzzy-theory"
version = "0.1.0"
authors = [
  { name="John Wesley Hostetter", email="jhostetter16@gmail.com" },
]
description = "The fuzzy-theory library provides a PyTorch interface to fuzzy set theory and fuzzy logic operations."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[project.optional-dependencies]
dashboard = ["dash==2.18.2", "dash-cytoscape==1.0.2", "plotly==5.24.1"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[project.urls]
Homepage = "https://github.com/johnHostetter/fuzzy-theory"
Issues = "https://github.com/johnHostetter/fuzzy-theory/issues"

[tool.hatch.build]
include = [
    "src/fuzzy/**",
    "README.md",
    "LICENSE",
]
exclude = [
    "examples/**",
    "tests/**",
    "*.pyc",
    "*.pyo",
    ".git/**",
    "build/**",
    "dist/**",
    ".venv/**",
]
# Ignore VCS
ignore = ["*.git", "*.hg", ".git/**", ".hg/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/fuzzy"]

[tool.isort]
known_first_party=["fuzzy", "regime"]

[dependency-groups]
dev = ["black==25.11.0"]