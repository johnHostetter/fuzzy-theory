name: Sphinx Documentation
on:
  push:
    branches: [main, workflow_dispatch]
  pull_request:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9"]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3
        with: # https://stackoverflow.com/questions/59271919/how-to-clone-public-submodule-in-github-actions
          submodules: true  # change to recursive if submodules require another submodule
      - name: Setup Python ${{ matrix.python-version }} 🐍
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies 🔧
        run: |
          # install project dependencies
          python -m pip install pip==24.0
          python -m pip install wheel==0.42.0
          python -m pip install setuptools==69.1.0
          python -m pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m pip install -e .
          # install Sphinx dependencies
          python -m pip install -U sphinx
          python -m pip install sphinx-rtd-theme

      - name: Build Sphinx Documentation 📚
        run: |
          sphinx-apidoc -f -o docs/_source/ src
          sphinx-build docs _build

      - name: Disable Jekyll 🧪
        run: |
          # .nojekyll must live inside _build/ (not the repo root) so it is
          # actually included in what gets deployed below - the deploy action
          # reads _build/'s contents directly off disk, it does not need (and,
          # since _build/ is gitignored, cannot have) them committed to this
          # branch first
          touch _build/.nojekyll

      - name: Deploy Sphinx Documentation 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _build/ # The folder the action should deploy.